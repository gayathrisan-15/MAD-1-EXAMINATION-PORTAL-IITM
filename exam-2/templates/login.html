{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4"><h2 class="mb-1">Welcome back</h2><p class="text-muted">Sign in to your examination portal.</p>
<form method="post">{{ csrf_input() }}<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Log in</button></form><p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
<hr><small class="text-muted">Local demo admin: admin@emp.local / Admin@123</small></div></div>{% endblock %}
