<div class="table-responsive"><table class="table table-striped align-middle"><tr><th>Exam</th><th>Date</th><th>Time</th><th>Capacity</th><th>Booked</th><th>Status</th><th></th></tr>{% for s in slots %}<tr><td>{{ s.exam_name }}</td><td>{{ s.exam_date }}</td><td>{{ s.start_time }}–{{ s.end_time }}</td><td>{{ s.capacity }}</td><td>{{ s.booked }}</td><td>{{ s.status }}</td><td><form method="post" action="{{ url_for('delete_slot',sid=s.id) }}">{{ csrf_input() }}<button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="7">No slots created.</td></tr>{% endfor %}</table></div>
