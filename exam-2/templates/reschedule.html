{% extends "base.html" %}{% block title %}Reschedule{% endblock %}{% block content %}<h1 class="h2">Reschedule booking #{{ booking.id }}</h1><p>Student: {{ booking.student_name }} · Examination: {{ booking.exam_name }}</p><form method="post" class="card p-4">{{ csrf_input() }}<label class="form-label">Choose a new slot for this examination</label><select class="form-select mb-3" name="slot_id" required>{% for s in choices %}<option value="{{ s.id }}">{{ s.exam_date }} · {{ s.start_time }}–{{ s.end_time }} · {{ s.examiner_name }} · capacity {{ s.capacity }}</option>{% endfor %}</select><button class="btn btn-primary" {% if not choices %}disabled{% endif %}>Confirm reschedule</button></form>{% endblock %}
