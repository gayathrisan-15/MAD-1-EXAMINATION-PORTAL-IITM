{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<h1 class="h2">My profile</h1><form method="post" class="card p-4 profile-form">{{ csrf_input() }}<label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required><label class="form-label">Email (cannot be changed)</label><input class="form-control mb-3" value="{{ user.email }}" disabled><label class="form-label">Department / programme</label><input class="form-control mb-3" name="department" value="{{ user.department }}"><label class="form-label">Contact</label><input class="form-control mb-3" name="contact" value="{{ user.contact }}"><button class="btn btn-primary">Save profile</button></form><form method="post" action="{{ url_for('change_password') }}" class="card p-4 profile-form mt-4">{{ csrf_input() }}<h2 class="h5">Change password</h2><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" autocomplete="current-password" required><label class="form-label">New password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="new_password" minlength="8" autocomplete="new-password" required><label class="form-label">Confirm new password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required><button class="btn btn-outline-primary">Update password</button></form>{% endblock %}
